name: starsfa
description: Star SFA iOS
publish_to: 'none'
version: 1.1.0+50
environment:
  sdk: '>=3.1.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.2
  url_launcher: ^6.2.5
  shared_preferences: ^2.2.2
  http: ^1.2.1
  device_info: ^2.0.3
  xml: ^6.5.0
  hive_flutter: ^1.1.0
  sqflite: ^2.3.2
  path: ^1.9.0
  intl: ^0.20.2
  camera: ^0.11.1
  path_provider: ^2.1.3
  image_picker: ^1.1.0
  geolocator: ^14.0.0
  table_calendar: ^3.1.1
  fl_chart: ^0.68.0
  flutter_pdfview: ^1.3.2
  package_info_plus: ^8.0.0
  webview_flutter: ^4.8.0
  flutter_svg: ^2.0.10+1
  archive: ^4.0.7
  flutter_email_sender: ^7.0.0
  connectivity_plus: ^6.0.5
  device_info_plus: ^11.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.3

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "assets/star_logo.png"
  min_sdk_android: 21
flutter:
  uses-material-design: true
  assets:
    - assets/background.jpg
    - assets/starhelp.pdf
    - assets/home_icons/
    - assets/check_in_icons/
    - assets/technical_meet_icons/
    - assets/market_overview_icons/
    - assets/complaint_report_icons/
    - assets/