apply plugin: 'com.android.application'

android {
    namespace = "com.forcepower.acedns"
    compileSdk 35
    defaultConfig {
        minSdkVersion 21
        targetSdk 35
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        multiDexEnabled true
        applicationId "com.forcepower.acedns"
    }

    buildTypes {
        debug {
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            manifestPlaceholders = [appIcon: "@drawable/acedns_native_logo"]
        }
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
            flavorDimensions("one")
            productFlavors {
                A {
                    dimension = "one"
                    applicationId "com.forcepower.starsfa"
                    manifestPlaceholders = [appIcon: "@drawable/acedns_native_logo"]
                }
                STAR {
                    dimension = "one"
                    applicationId "org.forcepower.acedns.STAR"
                    manifestPlaceholders = [appIcon: "@mipmap/ic_launcher_star"]
                }
                ASL {
                    dimension = "one"
                    applicationId "org.forcepower.acedns.ASL"
                    manifestPlaceholders = [appIcon: "@drawable/ic_launcher_asl"]
                }
            }
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }
    lint {
        baseline = file("lint-baseline.xml")
        abortOnError false
    }
    buildFeatures {
        buildConfig true
    }
    buildToolsVersion '35.0.0'
    ndkVersion '26.1.10909125'
}

dependencies {
    implementation 'androidx.viewpager2:viewpager2:1.0.0'
    implementation 'androidx.viewpager:viewpager:1.0.0'
    implementation 'androidx.activity:activity:1.8.0'
    def lifecycle_version = "2.6.2"
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    annotationProcessor 'com.github.bumptech.glide:compiler:4.16.0'
    implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.1'
    implementation "androidx.lifecycle:lifecycle-runtime-ktx:2.8.0"
    implementation "androidx.lifecycle:lifecycle-viewmodel:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-livedata:$lifecycle_version"
    implementation "androidx.lifecycle:lifecycle-viewmodel-savedstate:$lifecycle_version"
    annotationProcessor "androidx.lifecycle:lifecycle-compiler:$lifecycle_version"
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.cardview:cardview:1.0.0'
    implementation 'androidx.multidex:multidex:2.0.1'
    implementation 'com.google.code.gson:gson:2.10.1'
    implementation 'com.squareup.retrofit2:retrofit:2.9.0'
    implementation 'com.squareup.retrofit2:converter-gson:2.9.0'
    implementation 'com.squareup.retrofit2:converter-scalars:2.9.0'
    implementation files('libs/activation.jar')
    implementation files('libs/additionnal.jar')
    implementation files('libs/mail.jar')
    implementation project(':library')
    implementation files('libs/rhino.jar')
    implementation 'com.google.firebase:firebase-core:21.1.1'
    implementation 'com.google.firebase:firebase-iid:21.1.0'
    implementation 'com.google.firebase:firebase-messaging:23.2.1'
    implementation 'com.google.firebase:firebase-crashlytics:18.4.1'
    implementation 'com.google.firebase:firebase-analytics:21.3.0'
    implementation 'com.google.android.gms:play-services-maps:18.1.0'
    implementation 'com.android.support:appcompat-v7:30.0.0'
    implementation 'com.android.support:design:30.0.0'
    implementation 'com.jaredrummler:material-spinner:1.3.1'
    implementation 'com.android.volley:volley:1.2.1'
    implementation 'com.getkeepsafe.taptargetview:taptargetview:1.13.3'
    implementation 'com.google.android.gms:play-services-location:21.0.1'
    implementation 'com.github.AnyChart:AnyChart-Android:1.1.2'
    implementation 'com.androidplot:androidplot-core:1.5.10'
    implementation 'com.github.PhilJay:MPAndroidChart:v2.1.6'
    implementation files('libs/btsdk.jar')
    implementation 'com.google.android.material:material:1.9.0'
    implementation 'com.github.ceryle:SegmentedButton:v2.0.2'
    implementation 'androidx.constraintlayout:constraintlayout:2.1.4'
    implementation 'androidx.legacy:legacy-support-v4:1.0.0'
    implementation 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.10'
}
apply plugin: 'com.google.firebase.crashlytics'
apply plugin: 'com.google.gms.google-services'
